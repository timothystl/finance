name: Retire Finance staging (one time)

# One-time cleanup of the retired staging copy of Finance. Remove this workflow after the delete run
# succeeds. `list` is read only: it shows what exists. `delete` removes the staging Worker, its D1
# database, and its R2 bucket, and needs the confirmation phrase.

on:
  workflow_dispatch:
    inputs:
      action:
        description: list (read only) or delete
        required: true
        type: choice
        options: [list, delete]
      confirm:
        description: For delete, type exactly DELETE finance staging
        required: false
        type: string

permissions:
  contents: read

jobs:
  retire:
    name: Retire Finance staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: timothy-finance-app-staging
      DB: timothy-finance-db-staging
      DB_ID: 59dfc662-9f43-469f-936e-d7a0d3247036
      BUCKET: timothy-finance-files-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Show what exists
        shell: bash
        run: |
          set -uo pipefail
          echo "== Workers named like Finance"; npx wrangler deployments list --name "$WORKER" 2>&1 | tail -n 6 || true
          echo "== D1 database"; npx wrangler d1 info "$DB" 2>&1 | tail -n 15 || true
          echo "== R2 bucket"; npx wrangler r2 bucket info "$BUCKET" 2>&1 | tail -n 15 || true

      - name: Refuse to touch production names
        shell: bash
        run: |
          set -euo pipefail
          case "$WORKER$DB$BUCKET" in
            *staging*staging*staging*) ;;
            *) echo "::error::Not all targets are staging names."; exit 1 ;;
          esac
          test "$DB_ID" != "04988828-94b7-43bc-9689-ff570951f1c7"

      - name: Delete (only when asked and confirmed)
        if: inputs.action == 'delete' && inputs.confirm == 'DELETE finance staging'
        shell: bash
        run: |
          set -uo pipefail
          npx wrangler delete --name "$WORKER" --force || echo "Worker delete did not complete"
          npx wrangler d1 delete "$DB" --skip-confirmation || echo "D1 delete did not complete"
          npx wrangler r2 bucket delete "$BUCKET" || echo "R2 bucket delete did not complete (a non-empty bucket must be emptied first)"
