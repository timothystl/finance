name: Verify Finance D1 backup and recovery

# Finance's own port of Connect's tested "Verify D1 backup and recovery" workflow; see
# scripts/verify-finance-d1-recovery.sh for what changed in the port. It exports the production
# Finance database (read only), restores the export into a disposable D1 database, reconciles it, and
# deletes the disposable database and the export. workflow_dispatch only: an approved main commit
# SHA, a reason, and the `production` GitHub Environment. It needs the CLOUDFLARE_D1_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full main commit SHA approved for the recovery exercise
        required: true
        type: string
      reason:
        description: Reason for this recovery exercise
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finance-d1-recovery-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Export, restore, and reconcile Finance D1
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      # The one shared D1 data token. Cloudflare's D1 permission covers every database in the
      # account, so a separate Finance-only token added no protection (consolidated September 29, 2026).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      # A narrowly-scoped D1-only token (no broader Account Settings:Read
      # permission) can't auto-resolve which Cloudflare account to act
      # against -- wrangler then fails with "Failed to automatically
      # retrieve account IDs for the logged in user" before ever touching
      # D1. website's own D1/R2 recovery drills hit this exact failure and
      # fixed it the same way (see website PR #600): skip the auto-detect
      # entirely by passing the account id explicitly. The account id
      # itself is not sensitive on its own (Cloudflare's own dashboard
      # shows it openly to any account viewer) but is stored as a secret
      # here to match that existing precedent rather than introduce a
      # second convention.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_DB: timothy-finance-db
      SOURCE_DB_ID: 04988828-94b7-43bc-9689-ff570951f1c7
      RESULT_FILE: /tmp/finance-d1-recovery-result.json
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha }}

      - name: Verify the approved commit is on main
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export, restore, reconcile, and clean up
        run: bash scripts/verify-finance-d1-recovery.sh

      - name: Record recovery summary
        shell: bash
        env:
          RECOVERY_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          {
            echo '## Finance D1 recovery verification'
            echo
            echo "- Approved commit: \`${GITHUB_SHA}\`"
            echo "- Reason: ${RECOVERY_REASON}"
            jq -r '
              "- Source database UUID verified: `" + .source_db_id_verified + "`",
              "- Export: " + (.export_bytes | tostring) + " bytes; SHA-256 `" + .export_sha256 + "`",
              "- Oversized export handling: " + (.oversized_export_statements_rewritten | tostring) + " statement rewritten; " + (.large_cells_length_verified | tostring) + " large value length-verified",
              "- Schema: " + (.schema_objects_matched | tostring) + " objects matched; control SHA-256 `" + .schema_control_sha256 + "`",
              "- Integrity: " + .integrity_check + "; foreign-key violations " + (.foreign_key_violations | tostring),
              "- Rows: " + (.tables_matched | tostring) + " tables matched; control SHA-256 `" + .row_control_sha256 + "`",
              "- Monetary controls: " + (.monetary_controls_matched | tostring) + " columns matched; control SHA-256 `" + .monetary_control_sha256 + "`",
              "- Disposal: plaintext export removed and disposable D1 `" + .disposable_database + "` deleted",
              "- Sensitive rows and monetary values were not printed or retained as artifacts"
            ' "$RESULT_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
